name: Build & Publish to npm

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build library
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build @marchaui/marcha-ui
        run: npx ng build marcha-ui

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-marcha-ui
          path: dist/marcha-ui/

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    # Solo publicar en push a main (no en PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js with npm registry
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build @marchaui/marcha-ui
        run: npx ng build marcha-ui

      - name: Publish to npm
        run: npm publish ./dist/marcha-ui --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
